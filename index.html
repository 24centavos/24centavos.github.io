<!DOCTYPE html>
<html>
<head>
  <title>Conejo</title>
</head>
<body>
  <h1>https://may22.jbl2picturem0x5bparagraph.cfd/es/football/argentine-division-1-4402584/river-plate-vs-belgrano.html?icg=QVI&ilang=es </h1>
  
  <img id="imagen-cambiante" src="img/Conejo1.jpg" width="300" style="cursor:pointer;">

<script>

const imagenes = ["img/Conejo1.jpg", "img/Conejo2.jpg", "img/Conejo3.jpg"];


let indice = 0;


const img = document.getElementById("imagen-cambiante");


img.onclick = function() {
    indice++; // paso al siguiente
    if (indice >= imagenes.length) {
        indice = 0; // volver al inicio
    }
    img.src = imagenes[indice]; // cambiar imagen
};
</script>

<br><br>

    
<img src="img/conejoboton.jpg" id="conejo" style="width:200px; cursor:pointer;">

<!-- Sonido -->
<audio id="sonido">
  <source src="img/buni.mp3" type="audio/mpeg">
</audio>

<script>
  const conejo = document.getElementById("conejo");
  const sonido = document.getElementById("sonido");

  conejo.addEventListener("click", () => {
    sonido.currentTime = 0; // Reinicia el audio cada clic
    sonido.play();
  });
</script>
</body>
</html>
